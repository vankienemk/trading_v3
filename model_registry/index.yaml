# =============================================================================
# Model Registry Index — Trading V3 (multi-pattern, spec v1.1 §5.5)
# =============================================================================
# This file is the single source of truth for all trained models in the
# Trading V3 system. Each model is registered as an entry of the top-level
# ``models`` map keyed by its unique ``model_id``.
#
# Schema — spec §5.5 (every entry carries):
#   pattern_name            # "liquidity_sweep" | "double_bottom" | ...
#   symbol                  # trading symbol the model was trained on
#   timeframe               # "M15" | "H1" | ...
#   feature_schema_version  # schema version the tier-2 scorer consumes
#   lifecycle_state         # trained | validated | shadow | live | degraded | retired
#   live_metrics_ref        # event_lake/metrics/<model_id>.parquet (planned shadow/live metrics)
#   gate_passed             # §6.3 research gate decision
#   calibrated              # calibrator.pkl exists & is applied
#   config_hash             # §6.2 sha1(...)[:12]; legacy artifacts predating the
#                           # convention carry "" (documented per entry)
#   trained_at              # ISO-8601 training timestamp
# plus the legacy ModelInfo fields (symbol_origin, model_path, calibrator_path,
# feature_schema, horizon, target, metrics, created_at, notes).
#
# §4.3 registry fields (HMM regime plugin, requirements v1.0 §4.4) — OPTIONAL
# for existing entries (auto-resolved from the artifact's features.json at
# load), REQUIRED for any new model trained with HMM features:
#   feature_list            # EXACT train-time feature list (mirror of the
#                           # artifact's features.json "features").  When a
#                           # model's list contains hmm_* the model was trained
#                           # WITH the regime plugin and needs it at inference.
#   optional_plugins        # list of plugin metadata:
#                           #   - name: "hmm_regime"    # ≡ plugin name (guide §4.3)
#                           #     version: "1.0.0"
#                           #     required: true        # true → fail-closed (§6.3):
#                           #                           #   no signal w/o active plugin
# Example HMM-model entry (schema illustration; an actual entry would point at
# real artifacts):
#   double_bottom_xauusd_m15_v1_hmm:
#     model_id: "double_bottom_xauusd_m15_v1_hmm"
#     pattern_name: "double_bottom"
#     symbol: "XAUUSD"
#     timeframe: "M15"
#     feature_schema_version: "double-v1.1"
#     feature_list: [depth_atr, ..., hmm_state, hmm_prob_trending, hmm_prob_sideways, hmm_prob_high_vol, hmm_confidence]
#     optional_plugins:
#       - {name: hmm_regime, version: "1.0.0", required: true}
#
# ALL paths are relative to the trading_v3 workspace root (the directory that
# contains ``model_registry/``) — Trading V3 is self-contained, no
# ``trading_live/`` references.
#
# Lifecycle decisions:
#   * DB/DT (t1)      -> validated (research gate §6.3 PASS) — assignable
#   * FW/HS/IHS (t1)  -> trained   (explore only, gate_passed=false — NOT
#                        assignable until gates pass; see train_summary.json)
#   * xauusd/eurusd_v2 legacy -> migrated INTO trading_v3/artifacts with
#                        in-workspace artifacts; lifecycle_state=live (legacy
#                        production models still referenced by the persisted
#                        symbol registry — handoff spec §13 row 4).
#   * xauusd_v2 (bare alias) -> retired alias referenced by the persisted
#                        symbol_registry.json XAUUSD entry; kept registered so
#                        the legacy load path never breaks, excluded from GUI.
# =============================================================================

