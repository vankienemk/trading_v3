[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xauusd-liquidity-sweep"
version = "0.1.0"
description = "Liquidity sweep detection and scoring system for XAUUSD M15"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "pyarrow>=12.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]
gbm = [
    "catboost>=1.2",
    "lightgbm>=4.0",
    "xgboost>=2.0",
]
plot = [
    "matplotlib>=3.7",
]

[project.scripts]
xauusd-audit = "src.pipelines.build_events:data_audit_cli"
xauusd-events = "src.pipelines.build_events:build_events_cli"
xauusd-dataset = "src.pipelines.build_dataset:build_dataset_cli"
xauusd-train = "src.pipelines.train_model:train_model_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "PERF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

# matplotlib ships no type stubs; visualization code is enforced by ruff +
# pytest instead (see src/visualization/event_chart.py header).
[[tool.mypy.overrides]]
module = ["matplotlib.*", "sklearn", "sklearn.*", "catboost", "lightgbm"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "no_lookahead: tests that verify causality / absence of look-ahead bias (guide 25.2)",
]
